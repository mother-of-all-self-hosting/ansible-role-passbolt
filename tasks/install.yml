---
- name: Ensure Passbolt paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ passbolt_uid }}"
    group: "{{ passbolt_gid }}"
  with_items:
    - "{{ passbolt_base_path }}"
    - "{{ passbolt_gpg_path }}"
    - "{{ passbolt_jwt_path }}"

# The container's entrypoint writes its environment into this file on every start. It has to
# exist beforehand, as Docker refuses to bind-mount a source path which does not.
- name: Ensure Passbolt environment file exists
  ansible.builtin.file:
    path: "{{ passbolt_environment_file_path }}"
    state: touch
    mode: "0600"
    owner: "{{ passbolt_uid }}"
    group: "{{ passbolt_gid }}"
    access_time: preserve
    modification_time: preserve

- name: Ensure Passbolt support files created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ passbolt_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ passbolt_uid }}"
    group: "{{ passbolt_gid }}"
  with_items:
    - env
    - labels
    - passwd
  register: passbolt_support_files_result

- name: Ensure Passbolt container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ passbolt_container_image }}"
    pull: always
  register: passbolt_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: passbolt_container_image_pull_result_ansible_module is not failed

- name: Ensure Passbolt container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ passbolt_container_image }}"
  register: passbolt_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: passbolt_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in passbolt_container_image_pull_result_command.stdout"

- name: Ensure Passbolt container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ passbolt_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: passbolt_network_creation_result

- name: Ensure Passbolt container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ passbolt_container_network }}
  register: passbolt_network_creation_result
  changed_when: passbolt_network_creation_result.rc == 0
  failed_when: passbolt_network_creation_result.rc != 0 and 'already exists' not in passbolt_network_creation_result.stderr

- name: Ensure Passbolt systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/passbolt.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ passbolt_identifier }}.service"
    mode: "0644"
  register: passbolt_systemd_service_result

- name: Determine whether Passbolt needs a restart
  ansible.builtin.set_fact:
    passbolt_restart_necessary: >-
      {{
        passbolt_support_files_result.changed | default(false)
        or passbolt_systemd_service_result.changed | default(false)
        or passbolt_container_image_pull_result_ansible_module.changed | default(false)
        or passbolt_container_image_pull_result_command.changed | default(false)
      }}
