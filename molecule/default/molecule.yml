---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: passbolt-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance stores images via containerd. Its storage
      # cannot use overlay on top of the instance's own overlay filesystem, so a
      # volume puts it on a real filesystem.
      - /var/lib/containerd
    # Remove volumes along with the instance, so that local runs do not leave
    # gigabytes behind.
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        passbolt_debug_service_enabled: false
        passbolt_restarts_check_enabled: true

        # Variables for Passbolt
        #
        # Deliberately neither 33 (the image's www-data) nor 1000: every path the
        # image writes to at runtime belongs to www-data, so a uid which owns any
        # of them by accident would hide a path the role failed to make writable.
        passbolt_uid: 1873
        passbolt_gid: 1873

        passbolt_hostname: passbolt.molecule.local

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        passbolt_container_http_host_bind_port: "127.0.0.1:18080"

        passbolt_container_labels_traefik_enabled: true

        # Nothing resolves this host (`.invalid` is reserved for that).
        # molecule/verify_tasks.yml checks that Passbolt tried it. STARTTLS is
        # left on, as an `ssl://` host must make templates/env.j2 leave it out.
        passbolt_environment_variables_email_default_from: passbolt@molecule.local
        passbolt_environment_variables_email_transport_default_host: ssl://smtp.molecule.invalid

        # Variables required for Passbolt to connect to the Postgres database (via Unix socket)
        passbolt_database_type: postgres
        passbolt_database_postgres_username: my_database_username
        passbolt_database_postgres_password: my_database_password
        passbolt_database_name: passbolt
        passbolt_database_postgres_socket_enabled: true
        passbolt_database_postgres_socket_path_host: "{{ postgres_run_path }}"
        passbolt_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_unix_socket_enabled: true
        postgres_managed_databases: |
          {{
            [{
              'name': passbolt_database_name,
              'username': passbolt_database_postgres_username,
              'password': passbolt_database_postgres_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
